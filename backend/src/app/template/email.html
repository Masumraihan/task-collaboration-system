<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your OTP Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    header {
      background-color: #8243EE;
      padding: 20px;
      text-align: center;
    }

    header img {
      max-height: 40px;
    }

    main {
      padding: 30px;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    .otp-container {
      background-color: #f8f8f8;
      border-radius: 6px;
      padding: 20px;
      margin: 25px 0;
    }

    .otp {
      font-size: 36px;
      font-weight: bold;
      color: #8243EE;
      letter-spacing: 6px;
    }

    .note {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }

    footer {
      background-color: #f4f4f4;
      text-align: center;
      padding: 12px;
      font-size: 12px;
      color: #888;
    }

    @media only screen and (max-width: 600px) {
      .container {
        margin: 0;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <img src="/public/logo.png" alt="Endek Logo" />
    </header>

    <main>
      <h2>Your One-Time Password</h2>

      <div class="otp-container">
        <div class="otp">{{otp}}</div>
        <p class="note">This code will expire in 5 minutes.</p>
      </div>

      <p class="note">
        If you did not request this code, please ignore this email.
      </p>
    </main>

    <footer>
      <p>&copy; 2026 Endek. All rights reserved.</p>
    </footer>
  </div>
</body>

</html>
